<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Article</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="/" class="logo">Blog</a>
            <ul class="nav-links">
                <li><a href="/">Accueil</a></li>
                <li><a href="/page/backoffice.html">Mes Articles</a></li>
            </ul>
            <div class="nav-buttons">
                <button id="logoutBtn" class="btn btn-outline">Déconnexion</button>
            </div>
        </nav>
    </header>

    <main class="container">
        <div style="max-width: 700px; margin: 40px auto;">
            <h1 class="text-center mb-4" id="pageTitle">Créer un nouvel article</h1>

            <div id="successMessage" class="alert alert-success" style="display: none;"></div>
            <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>

            <form id="articleForm">
                <div class="form-group">
                    <label for="title">Titre de l'article</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="content">Contenu</label>
                    <textarea id="content" name="content" required></textarea>
                </div>

                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Publier l'article</button>
                    <a href="/page/backoffice.html" class="btn btn-outline">Annuler</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Blog. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="/js/create-article.js"></script>
</body>
</html>
